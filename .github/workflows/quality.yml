name: Quality and security

on:
  pull_request:
    branches: [testing, demo, prod]
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Dependency and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use locked npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Test deployment safeguards
        run: |
          for script in .github/scripts/*.mjs; do node --check "$script"; done
          node --test .github/scripts/deployment-policy.test.mjs
      - name: Audit all dependencies
        run: |
          set -o pipefail
          mkdir -p .artifacts/security
          npm audit --include=dev --audit-level=low --json | tee .artifacts/security/npm-audit-all.json
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p .artifacts/security
          npm audit --omit=dev --audit-level=low --json | tee .artifacts/security/npm-audit-production.json
      - name: Validate workflows and shell scripts
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-workflows.sh
      - name: Retain audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audits
          path: .artifacts/security/
          if-no-files-found: warn
          retention-days: 30

  tests:
    name: Front quality, tests and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_DEPLOY_ENV: testing
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: synthetic-ci-secret-not-used-outside-tests
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Browser regression tests (synthetic API only)
        run: npm run test:browser
      - name: Retain browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-tests
          path: |
            .artifacts/browser-results/
            .artifacts/browser-report/
          if-no-files-found: warn
          retention-days: 14
