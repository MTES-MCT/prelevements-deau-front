name: Deploy (testing) to Scaleway

on:
  push:
    branches: ["testing"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testing
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  test_build_deploy:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: testing

    env:
      TZ: Europe/Paris
      SCW_REGION: ${{ vars.SCW_REGION }}
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_DEPLOY_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate testing CI configuration
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONFIGURED_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_CONFIGURED_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_CONFIGURED_CONTAINER_ID: ${{ secrets.SCW_SERVERLESS_CONTAINER_ID_TESTING }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_API_URL"
          node .github/scripts/deploy-container.mjs --check testing

      - name: Use project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Use locked npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund

      - name: Install deps
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push immutable candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:testing-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_DEPLOY_ENV=${{ env.NEXT_PUBLIC_DEPLOY_ENV }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}


      - name: Install image vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan exact candidate image before any deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          bash .github/scripts/scan-image.sh "$IMAGE_REF"
          bash .github/scripts/smoke-image.sh "$IMAGE_REF"

      - name: Retain image vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-audit-${{ github.run_id }}
          path: .artifacts/security/image-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Install Scaleway CLI
        run: bash .github/scripts/install-scw.sh

      - name: Deploy and verify testing container
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ env.SCW_EXPECTED_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ env.SCW_EXPECTED_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
        run: node .github/scripts/deploy-container.mjs "$SCW_CONTAINER_ID" /healthz

      - name: Publish environment alias only after verified deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          ALIAS_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:testing-latest
        run: docker buildx imagetools create --tag "$ALIAS_REF" "$IMAGE_REF"
